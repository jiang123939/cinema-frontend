<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Checkout</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 40px; max-width: 500px; margin: auto; }
        .form-group { margin-bottom: 15px; }
        label { font-weight: bold; }
        input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px;}
        button { width: 100%; padding: 10px; background: #333; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px;}
        button:hover { background: #555; }
    </style>
</head>
<body>
    <h1>Complete Order</h1>
    <div class="form-group">
        <label>Name:</label> <input type="text" id="userName" placeholder="John Doe">
    </div>
    <div class="form-group">
        <label>Phone:</label> <input type="text" id="userPhone" placeholder="123456789">
    </div>
    <button onclick="submitOrder()">Submit Order</button>
    <script>
        function submitOrder() {
            const name = document.getElementById('userName').value;
            const phone = document.getElementById('userPhone').value;
            if (!name || !phone) {
                alert('Error: Please fill in all fields!');
                return;
            }
            alert(`Success! Order submitted for ${name}.`);
            window.location.href = 'home.html'; // 提交成功后跳回首页
        }
    </script>
</body>
</html>
